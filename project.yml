name: Interline
options:
  bundleIdPrefix: com.interline
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  Interline:
    type: application
    platform: iOS
    sources:
      - Interline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interline.app
  InterlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InterlineTests
    dependencies:
      - target: Interline
schemes:
  Interline:
    build:
      targets:
        Interline: all
        InterlineTests: [test]
    test:
      targets:
        - InterlineTests

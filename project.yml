name: Interline
options:
  bundleIdPrefix: com.interline
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Interline:
    type: application
    platform: iOS
    sources:
      - Interline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interline.app
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        SWIFT_VERSION: "6.0"

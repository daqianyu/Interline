name: Interline
options:
  bundleIdPrefix: com.interline
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: "YES"
    CODE_SIGN_STYLE: Automatic
targets:
  Interline:
    type: application
    platform: iOS
    info:
      path: Interline/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.interline.backup
            UTTypeDescription: Interline Library Backup
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [interlinebackup]
    sources:
      - Interline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.interline.app
  InterlineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InterlineTests
    dependencies:
      - target: Interline
  InterlineUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - InterlineUITests
    dependencies:
      - target: Interline
  InterlineFileProviderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - InterlineFileProviderUITests
    dependencies:
      - target: Interline
  InterlinePerformanceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - InterlinePerformanceTests
    dependencies:
      - target: Interline
schemes:
  Interline:
    build:
      targets:
        Interline: all
        InterlineTests: [test]
        InterlineUITests: [test]
    test:
      targets:
        - InterlineTests
        - InterlineUITests
  InterlineBackupPerformance:
    build:
      targets:
        Interline: all
        InterlinePerformanceTests: [test]
    test:
      targets:
        - InterlinePerformanceTests
  InterlineFileProviderVerification:
    build:
      targets:
        Interline: all
        InterlineFileProviderUITests: [test]
    test:
      targets:
        - InterlineFileProviderUITests

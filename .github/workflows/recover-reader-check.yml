name: Recover Stalled Reader Verification
on:
  push:
    branches: [improve/local-reading-features]
    paths: ['.github/workflows/recover-reader-check.yml']
permissions:
  actions: write
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stop only the superseded unresponsive run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          endpoint = 'repos/daqianyu/Interline/actions/runs/39399170380'
          run = json.loads(subprocess.check_output(['gh', 'api', endpoint], text=True))
          assert run['head_sha'] == '0552dc8f0f7d26cc4ef644c26e70eabb5cbe7a84'
          assert run['head_branch'] == 'improve/local-reading-features'
          if run['status'] != 'completed':
              subprocess.run(['gh', 'api', '--method', 'POST', endpoint + '/force-cancel'], check=True)
              print('Superseded stalled verification cancelled.')
          else:
              print('Superseded run already finished.')
          PY

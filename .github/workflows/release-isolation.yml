name: Release Test Isolation

on:
  pull_request:
    paths:
      - 'Interline/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/release-isolation.yml'
  push:
    branches: [main]
    paths:
      - 'Interline/**'
      - 'scripts/**'
      - 'project.yml'
      - '.github/workflows/release-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-isolation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-isolation:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test isolation verifier
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Generate clean production project
        run: |
          xcodebuild -version
          brew install xcodegen
          xcodegen generate
      - name: Build Release application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project Interline.xcodeproj \
            -scheme Interline \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ReleaseBuild \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee release-build.log
      - name: Verify actual Release product
        run: |
          python3 scripts/verify_release_isolation.py \
            --app ReleaseBuild/Build/Products/Release-iphoneos/Interline.app \
            --output release-isolation.json
      - name: Upload Release verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-isolation
          path: |
            release-build.log
            release-isolation.json
          if-no-files-found: error
